# ====== SmartMall-AI Docker Compose ======
# 一键启动: docker-compose up -d
# 包含: MySQL + Redis + Backend(FastAPI) + Frontend(Nginx)
version: "3.8"

services:
  # ====== MySQL 数据库 ======
  mysql:
    image: mysql:8.0
    container_name: smartmall-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: smartmall123
      MYSQL_DATABASE: smartmall
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - smartmall-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Redis 缓存 ======
  redis:
    image: redis:7-alpine
    container_name: smartmall-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartmall-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== FastAPI 后端 ======
  backend:
    build: ./backend
    container_name: smartmall-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:smartmall123@mysql:3306/smartmall?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: deepseek-chat
      CHROMA_PERSIST_DIR: /app/chroma_db
      SECRET_KEY: ${SECRET_KEY:-smartmall-production-secret-2026}
      DEBUG: "false"
    ports:
      - "8001:8001"
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    networks:
      - smartmall-net

  # ====== Nginx 反向代理 ======
  nginx:
    image: nginx:alpine
    container_name: smartmall-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - smartmall-net

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  chroma_data:

networks:
  smartmall-net:
    driver: bridge
