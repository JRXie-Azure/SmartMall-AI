# ====== SmartMall-AI Docker Compose (生产环境) ======
# 一键启动: docker-compose up -d --build
# 包含: MySQL + Redis + Backend(Java Spring Boot) + Nginx(HTTPS)
#
# 部署前请确认:
#   1. 环境变量已配置 (DEEPSEEK_API_KEY, SECRET_KEY 等)
#   2. nginx/certs/ 下有 fullchain.pem 和 privkey.pem (见 nginx/README.md)

version: "3.8"

services:
  # ====== MySQL 数据库 ======
  mysql:
    image: mysql:8.0
    container_name: smartmall-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartmall123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartmall}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - smartmall-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Redis 缓存 ======
  redis:
    image: redis:7-alpine
    container_name: smartmall-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - smartmall-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====== Java Spring Boot 后端 ======
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: smartmall-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DATABASE:-smartmall}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartmall123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-smartmall-dev-secret-key-change-me-in-production}
      SERVER_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      # 前端静态文件（Java 后端同源托管）
      - ./backend/static:/app/static:ro
    networks:
      - smartmall-net

  # ====== Nginx 反向代理 (HTTPS + 静态资源) ======
  nginx:
    image: nginx:alpine
    container_name: smartmall-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - smartmall-net

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  smartmall-net:
    driver: bridge
