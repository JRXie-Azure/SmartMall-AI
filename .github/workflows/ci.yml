name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: backend-java
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Run tests
        working-directory: backend-java
        run: ./mvnw test

      - name: Upload JAR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartmall-ai-jar
          path: backend-java/target/smartmall-ai.jar
