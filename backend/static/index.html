<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartMall AI - AI智能电商平台</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:transparent;color:#333;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#c0c4cc;border-radius:3px}
a{text-decoration:none;color:inherit}

.navbar{position:fixed;top:0;left:0;right:0;height:64px;background:#fff;display:flex;align-items:center;padding:0 32px;box-shadow:0 2px 12px rgba(0,0,0,.06);z-index:1000}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:#2563EB;cursor:pointer;flex-shrink:0}
.nav-logo .ai-icon{width:32px;height:32px;background:linear-gradient(135deg,#2563EB,#60a5fa);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
.nav-search{flex:0 1 420px;margin:0 32px;position:relative}
.nav-search input{width:100%;height:40px;border:2px solid #e4e7ed;border-radius:20px;padding:0 44px 0 18px;font-size:14px;outline:none;transition:border .2s}
.nav-search input:focus{border-color:#2563EB}
.nav-search .search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#2563EB;font-size:16px;cursor:pointer}
.nav-links{display:flex;gap:28px;margin:0 24px;flex-shrink:0}
.nav-links a{font-size:14px;color:#606266;transition:color .2s;position:relative;white-space:nowrap}
.nav-links a:hover,.nav-links a.router-link-active{color:#2563EB;font-weight:600}
.nav-links a.router-link-active::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:2px;background:#2563EB;border-radius:1px}
.nav-right{display:flex;align-items:center;gap:16px;margin-left:auto;flex-shrink:0}
.cart-icon{position:relative;font-size:20px;color:#606266;cursor:pointer}
.cart-badge{position:absolute;top:-6px;right:-8px;background:#f56c6c;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600}
.nav-avatar{width:32px;height:32px;border-radius:50%;background:#e4e7ed;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#909399;font-size:14px}
.nav-login{background:#2563EB;color:#fff;border:none;padding:6px 18px;border-radius:18px;font-size:13px;cursor:pointer;font-weight:600;transition:background .2s}
.nav-login:hover{background:#1d4ed8}
.nav-login.out{background:#f0f2f5;color:#606266}

.hero{margin-top:64px;background:url('/static/bg.jpg') center/cover no-repeat fixed;min-height:480px;display:flex;align-items:center;padding:0 80px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:700px;height:700px;background:radial-gradient(circle,rgba(37,99,235,.15) 0%,transparent 70%);border-radius:50%}
.hero-text{flex:1;z-index:1;max-width:560px}
.hero-text h1{font-size:64px;color:#fff;font-weight:800;line-height:1.15;margin-bottom:20px}
.hero-text h1 span{color:#60a5fa}
.hero-text p{font-size:20px;color:#cbd5e1;margin-bottom:36px}
.hero-btn{background:#fff;color:#0f172a;border:none;padding:16px 42px;border-radius:28px;font-size:17px;font-weight:700;cursor:pointer;transition:all .3s}
.hero-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,.2)}
.hero-img{flex:1;position:relative;height:420px;overflow:visible}
.hero-float{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:heroFloat 4s ease-in-out infinite}
.hero-float img{width:100%;height:100%;object-fit:cover;display:block}
.hero-float:nth-child(1){width:160px;height:200px;top:20px;right:60px;animation-delay:0s}
.hero-float:nth-child(2){width:140px;height:180px;top:120px;right:200px;animation-delay:.6s}
.hero-float:nth-child(3){width:120px;height:160px;top:200px;right:20px;animation-delay:1.2s}
@keyframes heroFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(1.5deg)}}

.section{padding:48px 60px}
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.sec-hd h2{font-size:24px;font-weight:700;color:#1e293b}
.sec-hd .tag{background:linear-gradient(135deg,#2563EB,#60a5fa);color:#fff;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:600}

.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.pc{background:#fff;border-radius:14px;overflow:hidden;transition:all .3s;cursor:pointer;border:2px solid transparent;position:relative}
.pc:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.1);border-color:#2563EB}
.pc .iw{height:200px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pc .iw img{width:100%;height:100%;object-fit:cover}
.pc .badge{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#2563EB,#60a5fa);color:#fff;font-size:11px;padding:2px 10px;border-radius:10px;font-weight:600;z-index:1}
.pc .bht{background:linear-gradient(135deg,#f56c6c,#f093a0)}
.pc .bnw{background:linear-gradient(135deg,#10b981,#6ee7b7)}
.pc .bsl{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.pc .inf{padding:14px}
.pc .inf .nm{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .inf .br{font-size:12px;color:#909399;margin-bottom:6px}
.pc .inf .bt{display:flex;align-items:center;justify-content:space-between}
.pc .inf .pr{font-size:18px;font-weight:700;color:#f56c6c}
.pc .inf .pr small{font-size:12px}
.pc .inf .ab{width:32px;height:32px;border-radius:50%;background:#2563EB;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.pc .inf .ab:hover{background:#1d4ed8;transform:scale(1.1)}
.pc .inf .rt{font-size:12px;color:#f59e0b;margin-bottom:6px}
.pc .inf .op{font-size:12px;color:#c0c4cc;text-decoration:line-through;margin-left:6px;font-weight:400}

/* AI推荐首页 */
.home-ai{background:url('/static/bg.jpg') center/cover no-repeat fixed;padding:48px 60px 60px}
.home-ai .sec-hd h2{color:#fff}
.home-ai .sec-hd .ai-sub{color:#94a3b8;font-size:15px;margin:0 0 0 12px}
.ai-row{margin-bottom:36px}
.ai-row-title{color:#60a5fa;font-size:17px;font-weight:700;margin-bottom:14px;padding-left:4px}
.ai-scroll{display:grid;grid-template-columns:repeat(4,220px);gap:20px}
.sf-dark{background:#0a0f1a}
.sf-dark .ft h4{color:#e2e8f0}
.sf-dark .ft a{color:#94a3b8}
.sf-dark .ft p{color:#64748b}
.sf-dark .fb{border-color:#1e293b;color:#475569}
.cat-pills{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.cat-pill{padding:8px 22px;border-radius:22px;border:2px solid #e4e7ed;background:#fff;font-size:14px;cursor:pointer;transition:all .2s;font-weight:500;color:#606266}
.cat-pill:hover,.cat-pill.active{border-color:#2563EB;background:#2563EB;color:#fff}

.sort-bar{display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.sort-bar .si{font-size:14px;color:#606266;cursor:pointer;transition:color .2s;position:relative;padding:4px 0}
.sort-bar .si:hover,.sort-bar .si.on{color:#2563EB;font-weight:600}
.sort-bar .si.on::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:#2563EB}
.sort-bar .afb{margin-left:auto;background:linear-gradient(135deg,#2563EB,#60a5fa);color:#fff;border:none;padding:8px 22px;border-radius:18px;font-size:13px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .2s}
.sort-bar .afb:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,99,235,.3)}

.ai-float{position:fixed;z-index:2000;cursor:pointer}
.ai-float-btn{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#60a5fa);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(37,99,235,.35);transition:all .3s}
.ai-float-btn:hover{transform:scale(1.08);box-shadow:0 12px 40px rgba(37,99,235,.45)}
.ai-float-btn i{font-size:28px;color:#fff}
.ai-float-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:#2563EB;font-weight:600;white-space:nowrap;background:#fff;padding:2px 8px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}

.chat-panel{position:fixed;z-index:2001;width:400px;height:540px;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.15);display:flex;flex-direction:column;overflow:hidden}
.chat-header{background:linear-gradient(135deg,#2563EB,#60a5fa);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-header .ca{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.chat-header .ct{color:#fff;font-size:16px;font-weight:600}
.chat-header .cc{margin-left:auto;color:rgba(255,255,255,.7);cursor:pointer;font-size:18px}
.chat-body{flex:1;overflow-y:auto;padding:16px;background:#f8fafc}
.cm{display:flex;gap:10px;margin-bottom:16px}
.cm.user{flex-direction:row-reverse}
.cm .ma{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.cm .ma.aia{background:linear-gradient(135deg,#2563EB,#60a5fa)}
.cm .ma.usa{background:#909399}
.cm .mb{max-width:260px;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6}
.cm.user .mb{background:#2563EB;color:#fff;border-top-right-radius:4px}
.cm.ai .mb{background:#fff;color:#333;border-top-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cm .mb .rc{background:#f8fafc;border-radius:10px;padding:10px;margin-top:8px;cursor:pointer;border:1px solid #e4e7ed;transition:border .2s}
.cm .mb .rc:hover{border-color:#2563EB}
.cm .mb .rc .rn{font-size:12px;font-weight:600;margin-bottom:4px}
.cm .mb .rc .rp{font-size:14px;color:#f56c6c;font-weight:700}
.chat-footer{padding:12px 16px;border-top:1px solid #e4e7ed;flex-shrink:0}
.cir{display:flex;gap:8px}
.cir input{flex:1;border:2px solid #e4e7ed;border-radius:18px;padding:8px 16px;font-size:13px;outline:none;transition:border .2s}
.cir input:focus{border-color:#2563EB}
.cir button{background:#2563EB;color:#fff;border:none;padding:8px 20px;border-radius:18px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap}
.cq{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cq span{background:#f0f2f5;padding:4px 12px;border-radius:12px;font-size:11px;cursor:pointer;transition:all .2s;color:#606266}
.cq span:hover{background:#2563EB;color:#fff}

.dw{margin-top:84px;padding:0 60px 60px}
.dt{display:flex;gap:48px;margin-bottom:40px}
.di{flex:0 0 480px;height:480px;background:#f0f2f5;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.di img{width:100%;height:100%;object-fit:cover}
.dif{flex:1}
.dif h1{font-size:28px;font-weight:700;margin-bottom:8px}
.dif .bl{font-size:14px;color:#909399;margin-bottom:12px}
.dif .pb{font-size:36px;font-weight:800;color:#f56c6c;margin-bottom:20px}
.dif .pb small{font-size:16px}
.dif .dc{font-size:14px;color:#606266;line-height:1.8;margin-bottom:24px}
.sr{margin-bottom:16px}
.sr label{font-size:13px;color:#909399;margin-bottom:8px;display:block}
.so{display:flex;gap:8px;flex-wrap:wrap}
.so .opt{padding:6px 18px;border:2px solid #e4e7ed;border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s}
.so .opt:hover,.so .opt.on{border-color:#2563EB;color:#2563EB;background:#eff6ff}
.db{display:flex;gap:16px;margin-top:28px}
.btn-buy{background:#2563EB;color:#fff;border:none;padding:14px 40px;border-radius:25px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-buy:hover{background:#1d4ed8;transform:translateY(-1px)}
.btn-cart{background:#f0f2f5;color:#606266;border:none;padding:14px 40px;border-radius:25px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-cart:hover{background:#e4e7ed}

.rvs{margin-top:40px}
.rvs h3{font-size:20px;font-weight:700;margin-bottom:20px}
.rv{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.rv .rh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rv .rh .ra{width:32px;height:32px;border-radius:50%;background:#e4e7ed;display:flex;align-items:center;justify-content:center;font-size:12px;color:#909399}
.rv .rh .rn{font-size:13px;font-weight:600}
.rv .rh .rs{color:#f59e0b;font-size:12px;margin-left:auto}
.rv .rt{font-size:13px;color:#606266;line-height:1.6}

.cw{margin-top:84px;padding:0 60px 60px}
.cw h2{font-size:24px;font-weight:700;margin-bottom:24px}
.ci{display:flex;align-items:center;gap:20px;background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.ci .ciim{width:80px;height:80px;background:#f0f2f5;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ci .ciim img{width:100%;height:100%;object-fit:cover}
.ci .ciin{flex:1}
.ci .ciin .cn{font-size:14px;font-weight:600;margin-bottom:4px}
.ci .ciin .cs{font-size:12px;color:#909399}
.ci .cip{font-size:18px;font-weight:700;color:#f56c6c;width:120px;text-align:center}
.ci .ciq{display:flex;align-items:center;gap:8px}
.ci .ciq button{width:28px;height:28px;border-radius:50%;border:1px solid #e4e7ed;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.ci .ciq button:hover{border-color:#2563EB;color:#2563EB}
.ci .ciq span{font-size:14px;font-weight:600;min-width:24px;text-align:center}
.ci .cid{color:#c0c4cc;cursor:pointer;font-size:18px;margin-left:16px;transition:color .2s}
.ci .cid:hover{color:#f56c6c}
.csm{background:#fff;border-radius:14px;padding:24px;margin-top:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.csm .tot{font-size:14px;color:#606266}
.csm .tot strong{font-size:28px;color:#f56c6c;font-weight:800;margin-left:8px}
.csm .ckb{background:#2563EB;color:#fff;border:none;padding:12px 36px;border-radius:22px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.csm .ckb:hover{background:#1d4ed8}

.ow{margin-top:84px;padding:0 60px 60px}
.ow h2{font-size:24px;font-weight:700;margin-bottom:24px}
.oc{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.oc .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f0f2f5}
.oc .oh .oid{font-size:13px;color:#909399}
.oc .oh .ost{font-size:13px;font-weight:600;padding:4px 12px;border-radius:10px}
.oc .oh .ost.pending{background:#fef3c7;color:#f59e0b}
.oc .oh .ost.paid{background:#dbeafe;color:#2563EB}
.oc .oh .ost.done{background:#d1fae5;color:#10b981}
.oc .ops{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.oc .ops .opi{width:60px;height:60px;background:#f0f2f5;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.oc .ops .opi img{width:100%;height:100%;object-fit:cover}
.oc .of{display:flex;justify-content:space-between;align-items:center}
.oc .of .otl{font-size:16px;font-weight:700;color:#f56c6c}

.auth-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:flex;align-items:center;justify-content:center}
.auth-bx{background:#fff;border-radius:20px;padding:40px;width:420px;max-width:90vw;position:relative}
.auth-bx h2{font-size:24px;font-weight:700;text-align:center;margin-bottom:8px}
.auth-bx .asb{text-align:center;color:#909399;font-size:14px;margin-bottom:28px}
.auth-bx .fg{margin-bottom:18px}
.auth-bx .fg label{font-size:13px;color:#606266;margin-bottom:6px;display:block}
.auth-bx .fg input{width:100%;border:2px solid #e4e7ed;border-radius:12px;padding:10px 16px;font-size:14px;outline:none;transition:border .2s}
.auth-bx .fg input:focus{border-color:#2563EB}
.auth-bx .abtn{width:100%;background:#2563EB;color:#fff;border:none;padding:12px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s}
.auth-bx .abtn:hover{background:#1d4ed8}
.auth-bx .asw{text-align:center;margin-top:16px;font-size:13px;color:#909399}
.auth-bx .asw a{color:#2563EB;cursor:pointer;font-weight:600}
.auth-bx .acl{position:absolute;top:16px;right:20px;font-size:20px;color:#c0c4cc;cursor:pointer}

.al{display:flex;min-height:100vh}
.asb2{width:240px;background:#0f172a;min-height:100vh;padding:20px 0;position:fixed;top:0;left:0;z-index:100}
.asb2 .sl{display:flex;align-items:center;gap:10px;padding:0 20px;margin-bottom:32px}
.asb2 .sl .sic{width:36px;height:36px;background:linear-gradient(135deg,#2563EB,#60a5fa);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800}
.asb2 .sl span{color:#fff;font-size:16px;font-weight:700}
.asb2 .sm a{display:flex;align-items:center;gap:12px;padding:12px 24px;color:#94a3b8;font-size:14px;transition:all .2s;cursor:pointer}
.asb2 .sm a:hover{color:#fff;background:rgba(255,255,255,.05)}
.asb2 .sm a.on{color:#fff;background:#2563EB}
.asb2 .sm a i{width:20px;text-align:center;font-size:16px}
.amn{margin-left:240px;flex:1;background:#f5f7fa;min-height:100vh}
.atb{height:64px;background:#fff;display:flex;align-items:center;padding:0 32px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.atb .ts{width:280px;height:36px;border:2px solid #e4e7ed;border-radius:18px;padding:0 14px;font-size:13px;outline:none;margin-right:24px}
.atb .tt{font-size:18px;font-weight:700;flex:1}
.atb .tr{display:flex;align-items:center;gap:16px}
.atb .tr .bell{font-size:18px;color:#606266;cursor:pointer;position:relative}
.atb .tr .bell .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:#f56c6c;border-radius:50%}
.atb .tr .tav{width:32px;height:32px;border-radius:50%;background:#e4e7ed;display:flex;align-items:center;justify-content:center;font-size:12px;color:#909399}
.ac{padding:24px 32px}

.sc{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:24px}
.scd{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.scd .sci{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;margin-bottom:12px}
.scd .sci.blue{background:linear-gradient(135deg,#2563EB,#60a5fa)}
.scd .sci.green{background:linear-gradient(135deg,#10b981,#6ee7b7)}
.scd .sci.orange{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.scd .sci.purple{background:linear-gradient(135deg,#8b5cf6,#c084fc)}
.scd .scv{font-size:28px;font-weight:800;color:#1e293b;margin-bottom:4px}
.scd .scl{font-size:13px;color:#909399;margin-bottom:8px}
.scd .sch{font-size:12px;display:flex;align-items:center;gap:4px}
.scd .sch.up{color:#10b981}
.scd .sch.down{color:#f56c6c}

.cr{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}

<body>
<div id="app">
  <!-- NAVBAR -->
  <nav class="navbar" v-if="!isAdmin">
    <div class="nav-logo" @click="$router.push('/')">
      <div class="ai-icon">AI</div>
      <span>SmartMall <small style="font-weight:400;font-size:14px">AI</small></span>
    </div>
    <div class="nav-search">
      <input v-model="G.searchQuery" placeholder="搜索你想要的商品..." @keyup.enter="doSearch">
      <i class="fas fa-star search-icon" @click="doSearch"></i>
    </div>
    <div class="nav-links">
      <router-link to="/">首页</router-link>
      <router-link to="/products">全部商品</router-link>
      <router-link to="/ai-recommend">AI推荐</router-link>
      <router-link to="/new">新品上市</router-link>
      <router-link to="/sale">限时特惠</router-link>
    </div>
    <div class="nav-right">
      <div class="cart-icon" @click="$router.push('/cart')">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" v-if="G.cart.length">{{G.cartTotal}}</span>
      </div>
      <div class="nav-avatar" v-if="G.isLoggedIn" style="cursor:pointer" @click="$router.push('/orders')"><i class="fas fa-user"></i></div>
      <button class="nav-login" v-if="!G.isLoggedIn" @click="G.showAuth=true">登录/注册</button>
      <button class="nav-login out" v-else @click="G.logout()">退出</button>
    </div>
  </nav>

  <router-view v-slot="{Component}">
    <transition name="fade" mode="out-in"><component :is="Component"/></transition>
  </router-view>

  <!-- AI FLOAT -->
  <div class="ai-float" v-if="!isAdmin" :style="{position:'fixed',left:G.fx+'px',top:G.fy+'px'}" @mousedown="G.startDrag($event)">
    <div class="ai-float-btn" @click="G.chatOpen=!G.chatOpen"><i class="fas fa-star"></i></div>
    <div class="ai-float-label">AI助手</div>
  </div>

  <!-- CHAT PANEL -->
  <transition name="fade">
    <div class="chat-panel" v-if="G.chatOpen" :style="{bottom:'110px',right:'32px'}" @mousedown.stop>
      <div class="chat-header">
        <div class="ca"><i class="fas fa-robot"></i></div>
        <div class="ct">AI购物助手</div>
        <div class="cc" @click="G.chatOpen=false"><i class="fas fa-times"></i></div>
      </div>
      <div class="chat-body" ref="chatBodyRef">
        <div class="cm ai">
          <div class="ma aia"><i class="fas fa-robot"></i></div>
          <div class="mb">你好！我是AI购物助手，有什么可以帮你的吗？😊</div>
        </div>
        <div v-for="(m,i) in G.chatMsgs" :key="i" :class="['cm',m.role]">
          <div :class="['ma',m.role==='user'?'usa':'aia']"><i :class="m.role==='user'?'fas fa-user':'fas fa-robot'"></i></div>
          <div class="mb">
            <div>{{m.text}}</div>
            <div v-if="m.product" class="rc" @click="$router.push('/product/'+m.product.id)">
              <div class="rn">{{m.product.name}}</div>
              <div class="rp">¥{{m.product.price}}</div>
            </div>
          </div>
        </div>
        <div v-if="G.chatLoading" class="cm ai">
          <div class="ma aia"><i class="fas fa-robot"></i></div>
          <div class="mb">思考中...</div>
        </div>
      </div>
      <div class="chat-footer">
        <div class="cir">
          <input v-model="G.chatInput" placeholder="输入你的问题..." @keyup.enter="G.sendChat()">
          <button @click="G.sendChat()">发送</button>
        </div>
        <div class="cq">
          <span @click="G.chatInput='热门推荐';G.sendChat()">热门推荐</span>
          <span @click="G.chatInput='订单查询';G.sendChat()">订单查询</span>
          <span @click="G.chatInput='退换货';G.sendChat()">退换货</span>
        </div>
      </div>
    </div>
  </transition>

  <!-- AUTH -->
  <transition name="fade">
    <div class="auth-ov" v-if="G.showAuth" @click.self="G.showAuth=false">
      <div class="auth-bx">
        <div class="acl" @click="G.showAuth=false"><i class="fas fa-times"></i></div>
        <h2>{{G.authMode==='login'?'欢迎回来':'注册账号'}}</h2>
        <p class="asb">{{G.authMode==='login'?'登录你的SmartMall AI账号':'创建一个新账号开始购物'}}</p>
        <div class="fg"><label>用户名</label><input v-model="G.authForm.username" :placeholder="G.authMode==='login'?'请输入用户名':'请设置用户名'"></div>
        <div v-if="G.authMode==='register'" class="fg"><label>邮箱</label><input v-model="G.authForm.email" placeholder="请输入邮箱" type="email"></div>
        <div class="fg"><label>密码</label><input v-model="G.authForm.password" placeholder="请输入密码" type="password" @keyup.enter="G.doAuth()"></div>
        <button class="abtn" @click="G.doAuth()" :disabled="G.authLoading">{{G.authLoading?'处理中...':(G.authMode==='login'?'登 录':'注 册')}}</button>
        <div class="asw">
          <template v-if="G.authMode==='login'">还没有账号？<a @click="G.authMode='register'">立即注册</a></template>
          <template v-else>已有账号？<a @click="G.authMode='login'">立即登录</a></template>
        </div>
      </div>
    </div>
  </transition>
</div>

<script>
const {createApp,ref,reactive,computed,onMounted,nextTick,watch} = Vue;
const {createRouter,createWebHashHistory} = VueRouter;

/* ====== API LAYER ====== */
let authToken = localStorage.getItem('token') || '';

async function api(path, opts = {}) {
  // 确保 token 是最新的
  if (!authToken) authToken = localStorage.getItem('token') || '';
  const h = {'Content-Type':'application/json'};
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  opts.headers = {...h, ...(opts.headers||{})};
  try {
    const r = await fetch(path, opts);
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) {
      // 仅在明确需要认证的写操作失败时才清除登录态
      const method = (opts.method || 'GET').toUpperCase();
      if (method === 'POST' || method === 'DELETE' || method === 'PUT') {
        authToken = '';
        localStorage.removeItem('token');
        G.isLoggedIn = false;
        G.cart = [];
        throw {detail: '登录已过期，请重新登录'};
      }
      // GET 请求 401 仅抛错，不清除登录态（避免刚登录就被 loadCart 的 401 清掉）
      throw data.detail ? data : {detail: '认证失败'};
    }
    if (!r.ok) throw data;
    return data;
  } catch(e) {
    if (e.detail) throw e;
    throw {detail: '网络错误，请检查后端服务是否运行'};
  }
}

function extractList(d) {
  if (Array.isArray(d)) return d;
  if (d && d.items) return d.items;
  if (d && d.data) return d.data;
  return [];
}

/* ====== CATEGORY CACHE ====== */
let catMap = {};
let catListData = [];

async function loadCategories() {
  try {
    const d = await api('/api/products/categories');
    catListData = extractList(d);
    catMap = {};
    catListData.forEach(c => { catMap[c.id] = c.name; });
  } catch(e) {
    catListData = [{id:1,name:'运动鞋'},{id:2,name:'电子产品'},{id:3,name:'服装'},{id:4,name:'配饰'}];
    catMap = {};
    catListData.forEach(c => { catMap[c.id] = c.name; });
  }
}

function getCatName(id) { return catMap[id] || '其他'; }

/* ====== PRODUCT NORMALIZE ====== */
function normProduct(p) {
  if (!p) return null;
  return {
    id: p.id,
    name: p.name || '未知商品',
    brand: p.brand || '',
    price: p.price || 0,
    originalPrice: p.original_price || p.originalPrice || p.price || 0,
    category: p.category || getCatName(p.category_id),
    category_id: p.category_id,
    rating: p.rating || 0,
    sales: p.sales || 0,
    isNew: p.is_new !== undefined ? p.is_new : (p.isNew || false),
    isSale: p.is_sale !== undefined ? p.is_sale : (p.isSale || false),
    isRecommend: p.is_recommend !== undefined ? p.is_recommend : (p.isRecommend || false),
    image: p.image || '',
    images: p.images || [],
    desc: p.description || p.desc || '',
    stock: p.stock || 0,
    is_active: p.is_active !== undefined ? p.is_active : true
  };
}

/* ====== ALL PRODUCTS CACHE ====== */
let allProducts = [];

async function loadAllProducts() {
  try {
    const d = await api('/api/products?page_size=100');
    allProducts = extractList(d).map(normProduct).filter(p => p.is_active !== false);
  } catch(e) {
    allProducts = [];
  }
}

/* ====== IMAGE ERROR HANDLER ====== */
const imgErr = (e) => { e.target.style.display = 'none'; };

/* ====== GLOBAL STATE ====== */
const G = reactive({
  isLoggedIn: !!authToken,
  showAuth: false,
  authMode: 'login',
  authForm: {username:'', email:'', password:''},
  authLoading: false,
  searchQuery: '',
  cart: [],
  chatOpen: false,
  chatMsgs: [],
  chatInput: '',
  chatLoading: false,
  fx: window.innerWidth - 96,
  fy: window.innerHeight - 130,
  get cartTotal() { return this.cart.reduce((s,i) => s + (i.qty || i.quantity || 0), 0); },
  doAuth, logout, addToCart, removeCart, submitOrder, sendChat, startDrag, loadCart
});

/* ====== AUTH ====== */
async function doAuth() {
  if (G.authLoading) return;
  if (G.authMode === 'login' && !G.authForm.username) {
    ElementPlus.ElMessage.warning('请输入用户名'); return;
  }
  if (G.authMode === 'register' && (!G.authForm.username || !G.authForm.password)) {
    ElementPlus.ElMessage.warning('请填写完整信息'); return;
  }
  G.authLoading = true;
  try {
    if (G.authMode === 'login') {
      const d = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({username: G.authForm.username, password: G.authForm.password})
      });
      authToken = d.access_token || d.token;
      if (!authToken) throw {detail: '登录响应异常'};
      localStorage.setItem('token', authToken);
      G.isLoggedIn = true;
      G.showAuth = false;
      G.authForm = {username:'', email:'', password:''};
      ElementPlus.ElMessage.success('登录成功');
      // 加载购物车，失败也不影响登录状态
      try { await G.loadCart(); } catch(e) { console.log('登录后加载购物车失败，稍后重试', e); }
    } else {
      const d = await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({username: G.authForm.username, email: G.authForm.email, password: G.authForm.password})
      });
      authToken = d.access_token || d.token;
      if (authToken) {
        localStorage.setItem('token', authToken);
        G.isLoggedIn = true;
      }
      G.showAuth = false;
      G.authForm = {username:'', email:'', password:''};
      ElementPlus.ElMessage.success('注册成功！');
      if (G.isLoggedIn) {
        try { await G.loadCart(); } catch(e) { console.log('注册后加载购物车失败', e); }
      }
    }
  } catch(e) {
    ElementPlus.ElMessage.error(e.detail || (G.authMode==='login' ? '登录失败' : '注册失败'));
  }
  G.authLoading = false;
}

function logout() {
  authToken = '';
  localStorage.removeItem('token');
  G.isLoggedIn = false;
  G.cart = [];
  ElementPlus.ElMessage.info('已退出登录');
}

/* ====== CART ====== */
async function loadCart() {
  if (!authToken) { G.cart = []; return; }
  try {
    const d = await api('/api/cart/items');
    const items = extractList(d);
    G.cart = items.map(item => ({
      id: item.id,
      product_id: item.product_id,
      name: (item.product && item.product.name) || item.name || '商品',
      price: (item.product && item.product.price) || item.price || 0,
      image: (item.product && item.product.image) || item.image || '',
      qty: item.quantity || item.qty || 1,
      spec: '默认规格'
    }));
  } catch(e) {
    G.cart = [];
  }
}

async function addToCart(p, qty) {
  qty = qty || 1;
  if (!G.isLoggedIn) { G.showAuth = true; return; }
  try {
    await api('/api/cart/items', {
      method: 'POST',
      body: JSON.stringify({product_id: p.id, quantity: qty})
    });
    await G.loadCart();
    ElementPlus.ElMessage.success('已加入购物车');
  } catch(e) {
    ElementPlus.ElMessage.error(e.detail || '加入购物车失败');
  }
}

async function removeCart(cartItemId) {
  try {
    await api('/api/cart/items/' + cartItemId, {method: 'DELETE'});
    await G.loadCart();
    ElementPlus.ElMessage.success('已移除');
  } catch(e) {
    ElementPlus.ElMessage.error('删除失败');
  }
}

async function submitOrder() {
  if (!G.cart.length) { ElementPlus.ElMessage.warning('购物车为空'); return; }
  try {
    const result = await api('/api/orders', {method: 'POST'});
    G.cart = [];
    ElementPlus.ElMessage.success('下单成功！');
    return result;
  } catch(e) {
    const msg = e.detail || (typeof e === 'string' ? e : '下单失败');
    ElementPlus.ElMessage.error(msg);
    throw e;
  }
}

/* ====== CHAT ====== */
async function sendChat() {
  if (!G.chatInput.trim()) return;
  const text = G.chatInput.trim();
  G.chatMsgs.push({role: 'user', text});
  G.chatInput = '';
  G.chatLoading = true;
  nextTick(() => { const b = document.querySelector('.chat-body'); if (b) b.scrollTop = b.scrollHeight; });
  try {
    const headers = {'Content-Type': 'application/json'};
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    const r = await fetch('/api/ai/chat', {method: 'POST', headers, body: JSON.stringify({message: text})});
    const d = await r.json();
    const msg = {role: 'ai', text: d.reply || d.message || d.response || '让我为你推荐一些商品'};
    if (d.products && d.products.length) {
      msg.product = normProduct(d.products[0]);
    }
    G.chatMsgs.push(msg);
  } catch(e) {
    G.chatMsgs.push({role: 'ai', text: '抱歉，AI助手暂时不可用，请稍后再试。'});
  }
  G.chatLoading = false;
  nextTick(() => { const b = document.querySelector('.chat-body'); if (b) b.scrollTop = b.scrollHeight; });
}

/* ====== DRAG ====== */
let _dragging = false, _dox = 0, _doy = 0;
function startDrag(e) {
  _dragging = true; const ev = e.touches ? e.touches[0] : e;
  _dox = ev.clientX - G.fx; _doy = ev.clientY - G.fy;
  document.addEventListener('mousemove', onDrag); document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchmove', onDrag); document.addEventListener('touchend', stopDrag);
  e.preventDefault();
}
function onDrag(e) { if (!_dragging) return; const ev = e.touches ? e.touches[0] : e; G.fx = ev.clientX - _dox; G.fy = ev.clientY - _doy; }
function stopDrag() { _dragging = false; document.removeEventListener('mousemove', onDrag); document.removeEventListener('mouseup', stopDrag); document.removeEventListener('touchmove', onDrag); document.removeEventListener('touchend', stopDrag); }

/* ====== COMPONENTS ====== */

// HOME
const HomePage = {template:`
<div>
  <div class="hero">
    <div class="hero-text">
      <h1><span>AI智能推荐</span><br>懂你想要的</h1>
      <p>基于深度学习的个性化商品推荐，让购物更简单</p>
      <button class="hero-btn" @click="$router.push('/products')">立即探索</button>
    </div>
    <div class="hero-img">
      <a v-for="(p,i) in heroItems" :key="p.id" :href="'#/product/'+p.id" class="hero-float" :style="{transform:heroRots[i]}">
        <img :src="p.image" @error="imgErr">
      </a>
    </div>
  </div>
  <div class="home-ai">
    <div class="sec-hd"><span class="tag">AI</span><h2>✨ AI 为你推荐</h2><p class="ai-sub">基于你的喜好，智能精选</p></div>
    <div v-if="loading" class="loading-wrap"><i class="fas fa-spinner"></i><p>加载推荐商品中...</p></div>
    <template v-else>
      <div class="ai-row" v-for="(row,ri) in aiRows" :key="ri">
        <div class="ai-row-title">{{row.title}}</div>
        <div class="ai-scroll">
          <div class="pc" v-for="p in row.items" :key="p.id" @click="$router.push('/product/'+p.id)">
            <div class="iw"><img :src="p.image" @error="imgErr"><span class="badge">AI推荐</span></div>
            <div class="inf"><div class="nm">{{p.name}}</div><div class="br">{{p.brand}}</div>
              <div class="bt"><div class="pr"><small>¥</small>{{p.price}}</div><button class="ab" @click.stop="G.addToCart(p)"><i class="fas fa-plus"></i></button></div>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
  <div class="sf sf-dark">
    <div class="ft">
      <div><h4>SmartMall AI</h4><p>AI驱动的智能电商平台，为您提供个性化购物体验。</p></div>
      <div><h4>快速链接</h4><a href="#/">首页</a><a href="#/products">全部商品</a><a href="#/ai-recommend">AI推荐</a><a href="#/sale">限时特惠</a></div>
      <div><h4>客户服务</h4><a>帮助中心</a><a>退换货政策</a><a>配送说明</a><a>联系我们</a></div>
      <div><h4>关注我们</h4><a>微信公众号</a><a>微博</a><a>抖音</a><a>小红书</a></div>
    </div>
    <div class="fb">© 2024 SmartMall AI. All rights reserved.</div>
  </div>
</div>`,
setup() {
  const aiRows = ref([]);
  const heroItems = ref([]);
  const loading = ref(true);
  const heroRots = ['rotate(-6deg)', 'rotate(4deg)', 'rotate(-3deg)'];

  onMounted(() => {
    const rec = allProducts.filter(p => p.isRecommend);
    const shuffled = [...allProducts].sort(() => Math.random() - 0.5);
    aiRows.value = [

    else if (curSort.value === 'ai') l.sort((a, b) => (b.isRecommend ? 1 : 0) - (a.isRecommend ? 1 : 0));

const CartPage = {template:`
<div class="cw">
  <h2>🛒 我的购物车</h2>
  <div v-if="cartLoading" class="loading-wrap"><i class="fas fa-spinner"></i><p>加载购物车...</p></div>
  <div v-else-if="!G.cart.length" class="pe"><i class="fas fa-shopping-cart"></i><p>购物车空空如也，去逛逛吧~</p></div>
  <template v-else>
    <div class="ci" v-for="it in G.cart" :key="it.id">
      <div class="ciim"><img :src="it.image" @error="imgErr" v-if="it.image"><i class="fas fa-box" v-else style="color:#c0c4cc;font-size:24px"></i></div>
      <div class="ciin"><div class="cn">{{it.name}}</div><div class="cs">{{it.spec||'默认规格'}}</div></div>
      <div class="cip">¥{{it.price}}</div>
      <div class="ciq"><button @click="chgQty(it,-1)">-</button><span>{{it.qty}}</span><button @click="chgQty(it,1)">+</button></div>
      <i class="fas fa-trash cid" @click="G.removeCart(it.id)"></i>
    </div>
    <div class="csm">
      <div class="tot">合计：<strong>¥{{total}}</strong></div>
      <button class="ckb" @click="checkout">去结算</button>
    </div>
  </template>
</div>`,
setup() {
  const cartLoading = ref(false);
  const total = computed(() => G.cart.reduce((s, i) => s + i.price * i.qty, 0));

  async function chgQty(item, delta) {
    const newQty = Math.max(1, item.qty + delta);
    if (newQty === item.qty) return;
    try {
      await api('/api/cart/items/' + item.id, {method: 'DELETE'});
      await api('/api/cart/items', {method: 'POST', body: JSON.stringify({product_id: item.product_id, quantity: newQty})});
      await G.loadCart();
    } catch(e) {
      ElementPlus.ElMessage.error('更新失败');
    }
  }

  const checkout = async () => {
    if (!G.isLoggedIn) { G.showAuth = true; return; }
    if (!G.cart.length) { ElementPlus.ElMessage.warning('购物车为空'); return; }
    try {
      await G.submitOrder();
      VueRouter.useRouter().push('/orders');
    } catch(e) {
      // submitOrder already shows error message
    }
  };

  onMounted(async () => {
    if (G.isLoggedIn && !G.cart.length) {
      cartLoading.value = true;
      await G.loadCart();
      cartLoading.value = false;
    }
  });

  return {G, total, cartLoading, chgQty, checkout, imgErr};
}};

    {id:'20240005',u:'孙七',p:'Puma RS-X',a:799,st:'已支付',sc:'d'}
  ]);

  onMounted(async () => {
    // Try loading admin stats from API
    try {
      const d = await api('/api/admin/stats');
      if (d) {
        stats.value = {
          revenue: d.total_revenue || d.revenue,
          orders: d.total_orders || d.orders,
          users: d.total_users || d.users,
          ai_rate: d.ai_conversion || d.ai_rate
        };
      }
    } catch(e) { /* use defaults */ }

    nextTick(() => {
      if (lc.value) {
        const c = echarts.init(lc.value);
        c.setOption({
          tooltip:{trigger:'axis'},grid:{left:50,right:20,top:20,bottom:30},
          xAxis:{type:'category',data:['周一','周二','周三','周四','周五','周六','周日']},
          yAxis:{type:'value'},
          series:[{data:[18200,22100,19800,24500,28900,32100,28560],type:'line',smooth:true,
            areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(37,99,235,.3)'},{offset:1,color:'rgba(37,99,235,.02)'}])},
            lineStyle:{color:'#2563EB',width:3},itemStyle:{color:'#2563EB'}}]
        });
        window.addEventListener('resize', () => c.resize());
      }
      if (pc.value) {
        const c = echarts.init(pc.value);
        c.setOption({
          tooltip:{trigger:'item'},
          series:[{type:'pie',radius:['45%','72%'],center:['50%','52%'],label:{show:true,fontSize:12},
            data:[{value:35,name:'AI推荐购买',itemStyle:{color:'#2563EB'}},{value:25,name:'搜索购买',itemStyle:{color:'#60a5fa'}},{value:20,name:'分类浏览',itemStyle:{color:'#f59e0b'}},{value:20,name:'活动购买',itemStyle:{color:'#10b981'}}]}]
        });
        window.addEventListener('resize', () => c.resize());
      }
    });
  });

  return {menu, lc, pc, stats, aOrders};
}};

/* ====== ROUTER ====== */
const router = createRouter({
  history: createWebHashHistory(),
  routes: [
    {path:'/', component:HomePage},
    {path:'/products', component:ProductsPage},
    {path:'/product/:id', component:ProductDetail},
    {path:'/ai-recommend', component:AIRecPage},
    {path:'/new', component:NewPage},
    {path:'/sale', component:SalePage},
    {path:'/cart', component:CartPage},
    {path:'/orders', component:OrdersPage},
    {path:'/admin', component:AdminPage},
  ]
});

/* ====== APP ====== */
const app = createApp({
  setup() {
    const isAdmin = computed(() => router.currentRoute.value.path === '/admin');
    const doSearch = () => { router.push('/products'); };
    return {G, isAdmin, doSearch};
  }
});
app.use(router);
app.use(ElementPlus);
app.mount('#app');

/* ====== INIT: Load data on startup ====== */
(async function init() {
  await loadCategories();
  await loadAllProducts();
  if (authToken) {
    try { await G.loadCart(); } catch(e) {}
  }
})();
</script>
