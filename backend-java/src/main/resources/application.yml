server:
  port: ${SERVER_PORT:8001}
  compression:
    enabled: true
  # SSE / WebSocket 场景下关闭响应缓冲很关键
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: SmartMall-AI

  # 默认走 H2 文件库 —— clone 即跑，零配置。生产用 -Dspring.profiles.active=mysql
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  jackson:
    # 关键: Pydantic 输出的是 snake_case，前端 index.html 直接依赖这些字段名
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: always
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    encoding: UTF-8
    locations: classpath:db/migration/{vendor}

  data:
    redis:
      # Redis 不可用时自动降级为内存缓存/内存限流，不影响启动
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

# ====== 业务配置 (对应原 Python config.py) ======
smartmall:
  app-name: SmartMall AI
  app-version: 2.0.0

  jwt:
    # 生产环境务必覆盖: openssl rand -hex 32
    # 与 Python 版共用同一密钥时，双方签发的 Token 可互相校验
    secret-key: ${SECRET_KEY:smartmall-dev-secret-key-change-me-in-production-1234567890}
    access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:1440}

  cache:
    expire-seconds: ${CACHE_EXPIRE_SECONDS:300}
    redis-enabled: ${REDIS_ENABLED:true}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests: ${RATE_LIMIT_REQUESTS:100}
    window-seconds: ${RATE_LIMIT_WINDOW:60}
    ai-requests: ${RATE_LIMIT_AI_REQUESTS:20}

  llm:
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    deepseek-model: ${DEEPSEEK_MODEL:deepseek-chat}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-seconds: 60
    stream-timeout-seconds: 120

  cors:
    origins: ${CORS_ORIGINS:*}

  upload:
    dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    root: INFO
    com.smartmall: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN

---
# ====== H2 兜底: 零配置本地开发 ======
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/smartmall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
# ====== MySQL 生产 ======
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:smartmall}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:smartmall123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: SmartMallHikari
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
